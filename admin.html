<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Registrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="admin.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<!-- LOGIN SCREEN -->
<main class="wrap admin-wrap" id="loginScreen">
  <section class="card login-card">
    <span class="eyebrow">LearnENABLED</span>
    <h1 class="admin-title">Admin Login</h1>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" />
      </div>
      <div id="loginError" class="submit-error hidden"></div>
      <button type="submit" id="loginBtn" class="btn btn-submit">Log in</button>
    </form>
  </section>
</main>

<!-- DASHBOARD SCREEN -->
<main class="wrap admin-wrap hidden" id="dashScreen">
  <section class="card dash-card">
    <div class="dash-header">
      <div>
        <span class="eyebrow">LearnENABLED</span>
        <h1 class="admin-title">Registrations</h1>
      </div>
      <button id="logoutBtn" class="btn btn-ghost">Log out</button>
    </div>

    <div class="filters">
      <div class="field">
        <label for="searchInput">Search (parent or student name)</label>
        <input type="text" id="searchInput" placeholder="Type a name..." />
      </div>

      <div class="field">
        <label for="gradeFilter">Grade</label>
        <select id="gradeFilter">
          <option value="">All grades</option>
          <option value="Primary 1 - 2">Primary 1 - 2</option>
          <option value="Primary 3 - 4">Primary 3 - 4</option>
          <option value="Primary 5 - 6">Primary 5 - 6</option>
          <option value="JSS 1 - 2 (Year 7 - 8)">JSS 1 - 2 (Year 7 - 8)</option>
          <option value="JSS 3 (Year 9)">JSS 3 (Year 9)</option>
          <option value="SSS 1 - 3 (Year 10 - 12)">SSS 1 - 3 (Year 10 - 12)</option>
        </select>
      </div>

      <div class="field">
        <label for="curriculumFilter">Curriculum</label>
        <select id="curriculumFilter">
          <option value="">All curriculums</option>
          <option value="Nigerian">Nigerian</option>
          <option value="British">British</option>
          <option value="American">American</option>
          <option value="Others">Others</option>
        </select>
      </div>

      <div class="field">
        <label for="classTimeFilter">Class Time</label>
        <select id="classTimeFilter">
          <option value="">All times</option>
          <option value="Morning">Morning</option>
          <option value="Evening">Evening</option>
        </select>
      </div>

      <div class="filter-actions">
        <button id="applyFiltersBtn" class="btn btn-submit btn-small">Apply Filters</button>
        <button id="clearFiltersBtn" class="btn btn-ghost btn-small">Clear</button>
      </div>
    </div>

    <div class="dash-toolbar">
      <span id="resultCount" class="result-count">Loading...</span>
      <button id="exportCsvBtn" class="btn btn-whatsapp btn-small" disabled>Download CSV</button>
    </div>

    <div class="table-scroll">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Country</th>
            <th>State</th>
            <th># Students</th>
            <th>Student Name(s)</th>
            <th>Grade</th>
            <th>Subjects</th>
            <th>Curriculum</th>
            <th>Class Time</th>
            <th>Source</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
